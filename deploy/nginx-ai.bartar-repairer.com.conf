# برتر AI — ai.bartar-repairer.com (استاتیک، خروجی Astro با trailingSlash: always)
# سرور اصلی 185.164.73.224 · /etc/nginx/sites-available/ai.bartar-repairer.com · docs/04-deploy.md
server {
    server_name ai.bartar-repairer.com;

    root /var/www/bartar-ai/dist;
    index index.html;
    charset utf-8;
    absolute_redirect off;   # ریدایرکت «بی‌اسلش ← با اسلش» نسبی بماند (پشت https هم درست باشد)

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bartar-ai/dist;
        default_type "text/plain";
        try_files $uri =404;
    }

    # آدرس‌ها با اسلش پایانی؛ /news/x → ۳۰۱ به /news/x/ (رفتار پیش‌فرض nginx برای پوشه)
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /fonts/  { expires 1y; add_header Cache-Control "public, immutable"; }
    location ~ ^/(cover|og)/ { expires 30d; add_header Cache-Control "public"; }
    location ~* \.(xml|json|txt)$ { expires 10m; }
    location = /manifest.webmanifest { default_type application/manifest+json; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/feed+json application/xml application/rss+xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/bartar-ai.access.log;
    error_log  /var/log/nginx/bartar-ai.error.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/ai.bartar-repairer.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/ai.bartar-repairer.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = ai.bartar-repairer.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name ai.bartar-repairer.com;
    return 404; # managed by Certbot


}
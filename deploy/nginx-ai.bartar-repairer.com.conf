# نمونه‌ی vhost استاتیک (هر جا که سایت سرو شود). قبل از reload: nginx -t
server {
    listen 80;
    listen [::]:80;
    server_name ai.bartar-repairer.com;
    root /var/www/bartar-ai/dist;
    index index.html;

    # آدرس‌ها همه با اسلش پایانی (trailingSlash: always)
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # دارایی‌های نام‌دار با هش: یک سال
    location /_astro/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location /fonts/  { expires 1y; add_header Cache-Control "public, immutable"; }
    # کاور و OG: یک ماه (نام ثابت، محتوای قطعی)
    location ~ ^/(cover|og)/ { expires 30d; add_header Cache-Control "public"; }
    # HTML و فیدها: کوتاه، چون هر ۴ ساعت عوض می‌شوند
    location ~ \.(xml|json|txt)$ { expires 10m; }

    gzip on;
    gzip_types text/css application/javascript application/json application/xml application/rss+xml application/feed+json image/svg+xml text/plain;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
